name: Build Painel Uriel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar 7z
        run: sudo apt-get install p7zip-full -y

      - name: Descompactar Projeto
        run: 7z x PainelUriel.7z

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Encontrar e Compilar
        run: |
          # O comando abaixo procura o gradlew em qualquer subpasta
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERRO: O arquivo gradlew nao foi encontrado no ZIP!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Entrando na pasta: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Painel-Uriel-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
