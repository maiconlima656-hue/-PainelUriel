name: Build Painel Uriel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar 7z
        run: sudo apt-get install p7zip-full -y

      - name: Descompactar Projeto
        run: 7z x PainelUriel.7z

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Entrar na pasta e Compilar
        run: |
          if [ -d "PainelUriel" ]; then cd PainelUriel; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Painel-Uriel-APK
          path: '**/app-debug.apk'
